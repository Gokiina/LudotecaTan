<div class="container">
  <h1 *ngIf="loan.id == null">Crear préstamo</h1>
  <h1 *ngIf="loan.id != null">Modificar préstamo</h1>

  <form>
    <mat-form-field>
      <mat-label>Identificador</mat-label>
      <input
        type="text"
        matInput
        placeholder="Identificador"
        [(ngModel)]="loan.id"
        name="id"
        disabled
      />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Nombre juego</mat-label>
      <mat-select disableRipple [(ngModel)]="loan.game" name="game" required>
        <mat-option *ngFor="let game of games" [value]="game">{{
          game.title
        }}</mat-option>
      </mat-select>
      <mat-error>El juego no puede estar vacío</mat-error>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Nombre cliente</mat-label>
      <mat-select
        disableRipple
        [(ngModel)]="loan.customer"
        name="customer"
        required
      >
        <mat-option *ngFor="let customer of customers" [value]="customer">{{
          customer.name
        }}</mat-option>
      </mat-select>
      <mat-error>El cliente no puede estar vacío</mat-error>
    </mat-form-field>
    <label>Fechas de préstamo</label>
    <div class="datepicker">
      <mat-form-field>
        <mat-label>Fecha inicio</mat-label>
        <input
          matInput
          [matDatepicker]="startDatePicker"
          [formControl]="startDate"
          [(ngModel)]="date.date_loan"
          name="date_loan"
          required
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="startDatePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker #startDatePicker></mat-datepicker>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Fecha fin</mat-label>
        <input
          matInput
          [matDatepicker]="endDatePicker"
          [min]="date.date_loan"
          [max]="maxDate"
          [(ngModel)]="date.date_return"
          name="date_return"
          required
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="endDatePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker #endDatePicker></mat-datepicker>
      </mat-form-field>
    </div>
  </form>

  <div class="buttons">
    <button mat-stroked-button (click)="onClose()">Cerrar</button>
    <button mat-flat-button color="primary" (click)="onSave()">Guardar</button>
  </div>
</div>
